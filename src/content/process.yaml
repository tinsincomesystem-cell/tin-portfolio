# =====================================================================
#  HOW WORKING WITH ME GOES — steps in order
# =====================================================================
eyebrow: "Process"
title: "From first call to *handoff*, no guesswork."
steps:
  - { title: "Discovery call", text: "We talk through your business, current systems, goals, audience and where your week goes. Free, 30 minutes, no pitch." }
  - { title: "Strategy & plan", text: "I come back with a practical plan for branding, website, CRM and automation, and what to do first for the biggest win." }
  - { title: "Scope & agreement", text: "We confirm deliverables, timeline, payment schedule, access needs and contract terms. Everything's in writing." }
  - { title: "Build & review", text: "I build, you review at set checkpoints. You'll always know what's done, what's next and what I need from you." }
  - { title: "Launch & handoff", text: "Everything is tested end to end, then handed off with walkthrough videos so you or your team can run it with confidence." }
