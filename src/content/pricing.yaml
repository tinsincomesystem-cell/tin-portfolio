        features: ["Everything in Essentials", "Multiple account reconciliation", "Invoice tracking", "Accounts receivable support", "Expense monitoring", "Monthly financial reports", "Bookkeeping cleanup & organization", "Priority monthly support"]
        footer: "Best for businesses with more active finances"

