# =====================================================================
#  PRICING — change any price, feature or plan here.
#  mode: "monthly" plans show under the Monthly toggle,
#        "project" plans show under One-time projects.
#  popular: true  → gets the "Most popular" highlight (one per category).
#  todo: "..."    → shows a TODO badge on the test site.
# =====================================================================

eyebrow: "Investment"
title: "Clear pricing. *No* surprises."
intro: "Starting investments. Final scope is confirmed on a free strategy call before anything starts."
currencyNote: "All prices in USD."
toggle: { monthly: "Monthly support", project: "One-time projects" }

categories:
  # ---------------- MONTHLY ----------------
  - id: executive-va
    label: "Executive VA"
    mode: monthly
    plans:
      - name: "Essentials"
        price: "$650"
        period: "/month"
        note: "Up to 20 hrs/month"
        features: ["Email & calendar management", "Data entry & file organization", "Social media scheduling (2 platforms)", "Basic CRM management", "Weekly progress reports", "Response within 24 hours"]
        footer: "3-month minimum · Best for focused execution"
      - name: "Operator"
        price: "$1,500"
        period: "/month"
        note: "Up to 40 hrs/week"
        popular: true
        features: ["Everything in Essentials", "CRM management & lead follow-up", "Content creation + email marketing", "Social media management (3 platforms)", "Drip campaign setup & management", "Basic CRM & automation support", "AI-powered workflow optimization", "Daily check-ins & reporting"]
        footer: "3-month minimum · Best for growing businesses"
      - name: "Systems Partner"
        price: "$2,500"
        period: "/month"
        note: "Systems + priority"
        features: ["Everything in Operator", "CRM & automation setup and management", "Funnel building (1 per quarter)", "Advanced automation setup", "AI integration across workflows", "Basic bookkeeping support", "Priority response within 4 hours", "Monthly strategy review call"]
        footer: "3-month minimum · Best for high-growth teams"

  - id: retainer
    label: "Retainer"
    mode: monthly
    plans:
      - name: "Retainer Fee"
        price: "$300"
        period: "/month"
        note: "Ongoing support for any project"
        popular: true
        features: ["Website, funnel & automation upkeep", "Small updates & edits", "Workflow & pipeline adjustments", "Form & calendar updates", "Basic troubleshooting", "Monthly system review"]
        footer: "Best for keeping your website, funnel or system healthy after launch"

  - id: bookkeeping
