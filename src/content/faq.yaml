eyebrow: "FAQ"
title: "Questions people *ask* before booking."
todo: "Review FAQ answers"
items:
  - q: "What industries do you work with?"
    a: "All of them. I work with medical professionals, real estate agents, local businesses, coaches and contractors. McMillen Equipment in San Diego is one example."
  - q: "What do I need to have ready before we start?"
    a: "Just a 30-minute call. If you have logins (CRM, website, domain, social) and any existing brand files, great. If not, I'll help you set everything up."
  - q: "Do I need a CRM already?"
    a: "No. I can set one up for you or work inside the one you have, including GoHighLevel and HubSpot. If it isn't the right fit, I'll tell you."
  - q: "How long does a brand kit or website take?"
    a: "A brand kit or website takes 4–8 weeks, depending on the project. You'll get a timeline before we start."
  - q: "How do payments work?"
    a: "Projects start with a deposit, with the balance due at milestones or launch. Monthly plans are billed monthly with a 3-month minimum, so there's time for real results."
  - q: "What hours do you work?"
    a: "I'm flexible. I personally work US hours, but if you need me to work while you sleep, that works too."
  - q: "Will I own everything you make?"
    a: "Yes. Once the project is paid, you own your logo files, designs, website and automations. You get organized source files and walkthrough videos at handoff."
  - q: "What if I just need a few hours of help?"
    a: "Hourly support is available at $15/hour for updates, fixes, one-off designs or overflow work."
