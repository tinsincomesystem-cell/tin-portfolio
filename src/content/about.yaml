eyebrow: "About"
title: "Hi, I'm *Tin*."
photo: "me/desk.png"
photoAlt: "Tin working at her desk with a laptop"
paragraphs:
  - "I've spent 6+ years inside businesses' inboxes, CRMs and marketing, starting in real estate. That's where I saw the real problem: great businesses losing customers to slow follow-up, scattered tools and a brand that didn't match how good they actually were."
  - "So I learned to fix all of it. Today I'm an AI Empowered Strategist: I plan funnels, build websites and brands, and set up automation that follows up while you sleep, for medical professionals, real estate agents and businesses in every industry. I even built my own CRM SaaS to run my business. I'm based in the Philippines and personally work US hours."
  - "My DISC profile is Conscientious & Steady: organized, detail-obsessed and calm under deadlines. I'd rather show you a working system than promise you a miracle."
